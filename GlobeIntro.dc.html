      const FS = (VA_GI_FONT[this.loc || 'ja'] || VA_GI_FONT.ja);
      for (const pl of VA_PLACES) {

          ctx.strokeStyle = 'rgba(233,199,123,0.9)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(lx, ly); ctx.lineTo(lx + pl.dx * 30, ly); ctx.stroke();
          const pulse = 6 + 4 * Math.sin(t * 3);
          ctx.fillStyle = 'rgba(233,199,123,0.25)'; ctx.beginPath(); ctx.arc(x, y, 6 + pulse, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#E9C77B'; ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();

          ctx.font = '26px Italiana, serif'; const tw = Math.max(ctx.measureText(pl.en).width, 90);
          ctx.fillStyle = 'rgba(8,14,20,.78)'; ctx.fillRect(pl.dx < 0 ? tx - tw - 14 : tx - 14, ly - 34, tw + 28, 64);
          ctx.fillStyle = '#F2F1EE'; ctx.font = '26px Italiana, serif'; ctx.fillText(pl.en, tx, ly - 4);
          ctx.fillStyle = '#C9CCCF'; ctx.font = '15px ' + FS[1]; ctx.fillText(subTxt, tx, ly + 20);
        } else {
          ctx.globalAlpha = pa; ctx.textAlign = pl.al;
          const lt = pl.ink === 'light';
          if (pl.air) { ctx.fillStyle = '#23485A'; ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill(); }
          const tx = x + pl.ox, ty = y + pl.oy;
          ctx.font = '18px ' + FS[0]; ctx.fillStyle = lt ? '#EDE6D6' : '#1E2428';
          ctx.fillText(islTxt || pl.jp, tx, ty + 6);
          ctx.font = '12px "Zen Kaku Gothic New", sans-serif'; ctx.fillStyle = lt ? 'rgba(237,230,214,.7)' : 'rgba(30,36,40,.7)';
          if (!islTxt) ctx.fillText(pl.en, tx, ty + 22);
        }
      }
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    if (this.coord) {
      const la = c.lat, lo = ((c.lon % 360) + 540) % 360 - 180;
      this.coord.textContent = Math.abs(la).toFixed(2) + '°' + (la >= 0 ? 'N' : 'S') + '  ' + Math.abs(lo).toFixed(2) + '°' + (lo >= 0 ? 'E' : 'W');
    }
  }
  renderVals() {
    if (!this._refs) {
      this._refs = {
        rootRef: (el) => { this.root = el; },
        canvasRef: (el) => { this.cv = el; },
        coordRef: (el) => { this.coord = el; },
        replay: () => { this.play(); }

    }
    const st = (this.state && this.state.stage != null) ? this.state.stage : 0;
    const CAPS = [
      { en: 'FROM ORBIT', jp: '地球の上から、旅をはじめる。' },
      { en: 'JAPAN', jp: '日本へ。' },
      { en: 'SETO INLAND SEA', jp: '島々が浮かぶ、瀬戸内海。' },
      { en: 'TAKAMATSU', jp: '香川県高松市。ここに、Villa Asakuraがあります。' }

    if (this.loc !== loc) { this.loc = loc; if (this.cv) setTimeout(() => this.draw(), 0); }
    const GL = VA_GI_I18N[loc];

  }
