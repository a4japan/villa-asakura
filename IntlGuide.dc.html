<x-dc>

<section id="good-to-know" class="va-ig" lang="{{lang}}" style="font-family: {{font}}; color: #111315; background: #E6E5E0; line-height: 1.75; padding-top: 112px; padding-bottom: 112px; padding-left: clamp(20px, 5cqw, 64px); padding-right: clamp(20px, 5cqw, 64px)">

</div>

</div>
</section>

const VA_IG = {"I": {"en": {"eye": "GOOD TO KNOW", "h": "First time in Japan? Here is what helps.", "lead": "The short version of what international guests ask us most. Anything else — just message us.", "note": "Flight routes, times and fares change. Please check the airline and airport websites.", "btn": "See access & FAQ", "btn2": "Message us", "t": {"fly": ["Getting to Takamatsu", "Direct flights to Takamatsu Airport (TAK) from cities including Seoul, Taipei and Hong Kong. From Tokyo, about 1 hr 20 by air. From Osaka or Kyoto, take the shinkansen to Okayama, then the Marine Liner across the sea — about 2 hrs."], "city": ["Airport to your stay", "Airport limousine bus to the city centre in about 35 min (¥1,000), or a taxi in about 30 min. Private transfers can be arranged on request."], "lang": ["Languages", "We reply in English, Japanese and Chinese. Guides and house manuals are available in English."], "msg": ["How to reach us", "Message us on Instagram (@villa_asakura) or email info@a4tokyo.com."], "pay": ["Payment", "Your stay is paid online when you book. In town, most places take cards, but some udon shops are cash only — keep some yen."], "home": ["At the house", "Shoes off at the entrance, as in Japanese homes. Each house has a full kitchen, washer-dryer and free Wi-Fi."], "rules": ["House rules", "Only registered guests may enter. No parties, no smoking. Shared areas have security cameras."], "power": ["Power & plugs", "100V, type A plugs (two flat pins). Bring an adapter if your devices use a different plug."], "sos": ["In an emergency", "Police 110 ・ Fire / Ambulance 119. Your host contact is in the house manual."]}}, "zhs": {"eye": "GOOD TO KNOW", "h": "第一次来日本？这些信息会有帮助。", "lead": "整理了海外客人最常问的问题。其他事情，欢迎直接发消息给我们。", "note": "航线、时间与票价可能变动，请以航空公司与机场官网为准。", "btn": "交通与常见问题", "btn2": "发消息咨询", "t": {"fly": ["如何到达高松", "高松机场（TAK）有来自首尔、台北、香港等城市的直飞航班。从东京乘飞机约1小时20分。从大阪、京都乘新干线到冈山，再换乘跨海的 Marine Liner，约2小时。"], "city": ["从机场到住处", "乘机场巴士到市中心约35分钟（1,000日元），出租车约30分钟。也可预约专车接送。"], "lang": ["语言", "可用中文、English、日本語回复。备有英文版指南与入住说明。"], "msg": ["联系方式", "请通过 Instagram（@villa_asakura）私信或电子邮件（info@a4tokyo.com）联系我们。"], "pay": ["付款", "住宿费用在预订时于线上支付。市内多数店铺可刷卡，但部分乌冬面店只收现金，请准备一些日元。"], "home": ["在住处", "和日本家庭一样，请在玄关脱鞋。每处都有完整厨房、洗衣烘干机和免费 Wi-Fi。"], "rules": ["入住规则", "仅限登记的住客进入。禁止聚会、禁止吸烟。公共区域设有监控摄像头。"], "power": ["电源与插头", "100V，A 型插头（两片扁脚）。如插头不同，请携带转换插头。"], "sos": ["紧急情况", "报警 110 ・ 火警／急救 119。房东联系方式写在入住说明中。"]}}, "zht": {"eye": "GOOD TO KNOW", "h": "第一次來日本？這些資訊會有幫助。", "lead": "整理了海外旅客最常問的問題。其他事情，歡迎直接傳訊息給我們。", "note": "航線、時間與票價可能變動，請以航空公司與機場官網為準。", "btn": "交通與常見問題", "btn2": "傳訊息諮詢", "t": {"fly": ["如何抵達高松", "高松機場（TAK）有來自首爾、台北、香港等城市的直飛航班。從東京搭飛機約1小時20分。從大阪、京都搭新幹線到岡山，再轉乘跨海的 Marine Liner，約2小時。"], "city": ["從機場到住處", "搭機場巴士到市中心約35分鐘（1,000日圓），計程車約30分鐘。也可預約專車接送。"], "lang": ["語言", "可用中文、English、日本語回覆。備有英文版指南與入住說明。"], "msg": ["聯絡方式", "請透過 Instagram（@villa_asakura）私訊或電子郵件（info@a4tokyo.com）聯絡我們。"], "pay": ["付款", "住宿費用在預訂時於線上支付。市區多數店家可刷卡，但部分烏龍麵店只收現金，請準備一些日圓。"], "home": ["在住處", "和日本家庭一樣，請在玄關脫鞋。每處都有完整廚房、洗脫烘衣機和免費 Wi-Fi。"], "rules": ["入住規則", "僅限登記的住客進入。禁止派對、禁止吸菸。公共區域設有監視器。"], "power": ["電源與插頭", "100V，A 型插頭（兩片扁腳），與台灣相同。"], "sos": ["緊急狀況", "報警 110 ・ 火警／救護車 119。房東聯絡方式寫在入住說明中。"]}}, "ko": {"eye": "GOOD TO KNOW", "h": "일본이 처음이라면, 이것만 알아 두세요.", "lead": "해외 게스트분들이 가장 많이 묻는 내용을 정리했습니다. 그 밖의 궁금한 점은 메시지로 편하게 물어보세요.", "note": "항공편·시간·요금은 변경될 수 있습니다. 항공사와 공항 공식 사이트에서 확인해 주세요.", "btn": "교통・자주 묻는 질문", "btn2": "메시지로 문의", "t": {"fly": ["다카마쓰 가는 법", "다카마쓰 공항(TAK)까지 서울·타이베이·홍콩 등에서 직항편이 있습니다. 도쿄에서는 비행기로 약 1시간 20분. 오사카·교토에서는 신칸센으로 오카야마까지 간 뒤, 바다를 건너는 마린 라이너로 약 2시간."], "city": ["공항에서 숙소까지", "공항 리무진 버스로 시내까지 약 35분(1,000엔), 택시로 약 30분. 전용 차량 픽업도 예약할 수 있습니다."], "lang": ["언어", "日本語・English・中文으로 답장드립니다. 영어 안내서와 숙소 매뉴얼이 있습니다."], "msg": ["연락 방법", "Instagram(@villa_asakura) 메시지나 이메일(info@a4tokyo.com)로 연락 주세요."], "pay": ["결제", "숙박 요금은 예약 시 온라인으로 결제됩니다. 시내 대부분의 가게는 카드를 쓸 수 있지만, 일부 우동 가게는 현금만 받으니 엔화를 조금 준비해 주세요."], "home": ["숙소에서", "일본 가정처럼 현관에서 신발을 벗어 주세요. 모든 숙소에 주방, 세탁 건조기, 무료 Wi-Fi가 있습니다."], "rules": ["하우스 룰", "등록된 게스트만 입실할 수 있습니다. 파티와 흡연은 금지입니다. 공용 공간에는 방범 카메라가 있습니다."], "power": ["전압・플러그", "100V, A타입 플러그(납작한 핀 2개). 한국과 모양이 다르니 변환 플러그를 챙겨 주세요."], "sos": ["긴급 상황", "경찰 110 ・ 화재・구급 119. 호스트 연락처는 숙소 매뉴얼에 있습니다."]}}, "th": {"eye": "GOOD TO KNOW", "h": "มาญี่ปุ่นครั้งแรก? ข้อมูลที่ควรรู้", "lead": "สรุปคำถามที่แขกต่างชาติถามเราบ่อยที่สุด เรื่องอื่น ๆ ส่งข้อความหาเราได้เลย", "note": "เส้นทางบิน เวลา และราคาอาจเปลี่ยนแปลง โปรดตรวจสอบกับสายการบินและเว็บไซต์สนามบิน", "btn": "การเดินทางและคำถามที่พบบ่อย", "btn2": "ส่งข้อความถึงเรา", "t": {"fly": ["เดินทางไปทาคามัตสึ", "มีเที่ยวบินตรงสู่สนามบินทาคามัตสึ (TAK) จากเมืองต่าง ๆ เช่น โซล, ไทเป และฮ่องกง จากโตเกียวบินประมาณ 1 ชั่วโมง 20 นาที จากโอซาก้าหรือเกียวโตนั่งชินคันเซ็นไปโอคายามะ แล้วต่อรถไฟ Marine Liner ข้ามทะเล รวมประมาณ 2 ชั่วโมง"], "city": ["จากสนามบินถึงที่พัก", "รถบัสลีมูซีนเข้าเมืองประมาณ 35 นาที (1,000 เยน) หรือแท็กซี่ประมาณ 30 นาที สามารถจองรถรับส่งส่วนตัวได้"], "lang": ["ภาษา", "เราตอบเป็น English・日本語・中文 มีคู่มือที่พักภาษาอังกฤษ"], "msg": ["ช่องทางติดต่อ", "ส่งข้อความทาง Instagram (@villa_asakura) หรืออีเมล info@a4tokyo.com"], "pay": ["การชำระเงิน", "ชำระค่าที่พักออนไลน์ตอนจอง ร้านส่วนใหญ่ในเมืองรับบัตร แต่ร้านอุด้งบางร้านรับเฉพาะเงินสด ควรพกเงินเยนไว้บ้าง"], "home": ["ที่บ้านพัก", "ถอดรองเท้าที่ทางเข้าแบบบ้านญี่ปุ่น ทุกที่มีครัว เครื่องซักผ้าอบแห้ง และ Wi-Fi ฟรี"], "rules": ["กฎของบ้าน", "เฉพาะแขกที่ลงทะเบียนเท่านั้น ห้ามจัดปาร์ตี้และห้ามสูบบุหรี่ พื้นที่ส่วนกลางมีกล้องวงจรปิด"], "power": ["ไฟฟ้าและปลั๊ก", "ไฟ 100V ปลั๊กแบบ A (ขาแบนสองขา) ควรพกอะแดปเตอร์มาด้วย"], "sos": ["กรณีฉุกเฉิน", "ตำรวจ 110 ・ ดับเพลิง / รถพยาบาล 119 เบอร์ติดต่อเจ้าของที่พักอยู่ในคู่มือ"]}}, "ja": {"eye": "GOOD TO KNOW", "h": "はじめての日本でも、迷わないように。", "lead": "海外のお客様からよくいただく質問を、短くまとめました（多言語版HOMEで各国語に切り替わります）。", "note": "航空路線・所要時間・運賃は変わることがあります。各社の公式サイトでご確認ください。", "btn": "アクセス・FAQ", "btn2": "メッセージで相談", "t": {"fly": ["高松への行き方", "高松空港（TAK）へはソウル・台北・香港などから直行便。東京から飛行機で約1時間20分。大阪・京都からは新幹線で岡山へ、マリンライナーで海を渡って約2時間。"], "city": ["空港から宿まで", "リムジンバスで市内まで約35分（1,000円）、タクシーで約30分。専用車の送迎も手配できます。"], "lang": ["言語", "日本語・English・中文でお返事します。英語の案内書・宿のマニュアルあり。"], "msg": ["連絡方法", "Instagram（@villa_asakura）のメッセージか、メール（info@a4tokyo.com）でどうぞ。"], "pay": ["お支払い", "宿泊料金は予約時にオンラインで。街のお店はカードが使えるところが多いですが、現金のみのうどん店もあります。"], "home": ["宿の中で", "日本の家と同じく、玄関で靴を脱いでください。キッチン・洗濯乾燥機・Wi-Fi完備。"], "rules": ["ハウスルール", "登録した方以外の入室・パーティー・喫煙は禁止。共用部には防犯カメラがあります。"], "power": ["電源", "100V・Aタイプ（平たい2本ピン）。必要に応じて変換プラグをお持ちください。"], "sos": ["緊急のとき", "警察 110 ・ 消防／救急 119。ホストの連絡先は宿のマニュアルに記載しています。"]}}}, "K": ["fly", "city", "lang", "msg", "pay", "home", "rules", "power", "sos"]};
const VA_IG_ICON = {"fly": "<path d=\"M2 16 L22 9 L20 7 L13 9 L7 3 L5 4 L9 10 L4 12 L2 10 L1 11 Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/>", "city": "<rect x=\"3\" y=\"7\" width=\"18\" height=\"10\" rx=\"3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><circle cx=\"7.5\" cy=\"18\" r=\"1.8\" fill=\"currentColor\"/><circle cx=\"16.5\" cy=\"18\" r=\"1.8\" fill=\"currentColor\"/><path d=\"M3 12 H21\" stroke=\"currentColor\" stroke-width=\"1.4\"/>", "lang": "<circle cx=\"12\" cy=\"12\" r=\"9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><path d=\"M3 12 H21 M12 3 C8 7 8 17 12 21 M12 3 C16 7 16 17 12 21\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"/>", "msg": "<path d=\"M4 5 H20 V16 H10 L5 20 V16 H4 Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/>", "pay": "<rect x=\"3\" y=\"6\" width=\"18\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><path d=\"M3 10 H21\" stroke=\"currentColor\" stroke-width=\"2\"/>", "home": "<path d=\"M3 11 L12 4 L21 11 V20 H3 Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><rect x=\"10\" y=\"14\" width=\"4\" height=\"6\" fill=\"currentColor\"/>", "rules": "<rect x=\"5\" y=\"3\" width=\"14\" height=\"18\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><path d=\"M8 8 H16 M8 12 H16 M8 16 H13\" stroke=\"currentColor\" stroke-width=\"1.4\"/>", "power": "<path d=\"M8 3 V8 M16 3 V8\" stroke=\"currentColor\" stroke-width=\"2\"/><rect x=\"5\" y=\"8\" width=\"14\" height=\"7\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><path d=\"M12 15 V21\" stroke=\"currentColor\" stroke-width=\"1.6\"/>", "sos": "<circle cx=\"12\" cy=\"12\" r=\"9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><path d=\"M12 7 V17 M7 12 H17\" stroke=\"currentColor\" stroke-width=\"2.4\"/>"};
