<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Follow & Connect | Villa Asakura</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Italiana&amp;family=Shippori+Mincho+B1:wght@400;600&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F2F1EE}
.va-sc a{color:inherit;text-decoration:none}
.va-sc .va-tile img{transition:transform .5s ease}
.va-sc .va-tile:hover img{transform:scale(1.04)}
</style>
</helmet>
<section id="follow" class="va-sc" lang="{{lang}}" style="font-family: {{font}}; color: #111315; background: #F2F1EE; line-height: 1.8; padding-top: 112px; padding-bottom: 112px; padding-left: clamp(20px, 5cqw, 64px); padding-right: clamp(20px, 5cqw, 64px)">
<div style="max-width: 1280px; margin: 0 auto">
<div style="display: flex; flex-wrap: wrap; gap: 24px 64px; align-items: flex-end; justify-content: space-between; margin-bottom: 56px">
<div style="flex: 1 1 420px"><p style="margin: 0 0 24px; font-size: 12px; letter-spacing: 0.3em; color: #23485A">{{L.eye}}</p><h2 style="margin: 0; font-family: {{serif}}; font-weight: 400; font-size: clamp(28px, 3.2cqw, 44px); line-height: 1.5">{{L.h}}</h2></div>
<p style="flex: 1 1 380px; margin: 0; font-size: 16px; color: #3E4246">{{L.lead}}</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: stretch">
<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap"><span style="display: inline-flex; align-items: center; gap: 10px; font-family: 'Italiana', serif; font-size: 22px; letter-spacing: 0.14em"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17.3" cy="6.7" r="1.2" fill="currentColor"/></svg>{{L.ig}}</span><span style="font-size: 14px; color: #5A5E62">{{L.acct}}</span></div>
<a href="{{links.instagram}}" target="_blank" rel="noopener" aria-label="{{L.igb}}" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{feed}}" as="f" hint-placeholder-count="9"><span class="va-tile" style="display: block; aspect-ratio: 4 / 5; overflow: hidden; background: #E6E5E0"><img src="{{f}}" alt="" loading="lazy" style="width: 100%; height: 100%; object-fit: cover; display: block"></span></sc-for>
</a>
<a href="{{links.instagram}}" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; background: #111315; color: #F2F1EE; font-size: 13px; letter-spacing: 0.16em"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17.3" cy="6.7" r="1.2" fill="currentColor"/></svg>{{L.igb}}</a>
</div>

</div>
<div style="margin-top: 56px; padding-top: 32px; border-top: 1px solid #C9C8C3; display: flex; flex-wrap: wrap; gap: 24px 48px; align-items: flex-start">
<div style="flex: 1 1 260px"><p style="margin: 0 0 6px; font-family: {{serif}}; font-size: 22px">{{L.ch}}</p><p style="margin: 0; font-size: 13px; color: #5A5E62">{{L.chs}}</p></div>
<div style="flex: 2.4 1 560px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px">
<sc-for list="{{chans}}" as="c" hint-placeholder-count="6"><a href="{{c.href}}" target="{{c.target}}" rel="noopener" style="{{c.style}}"><span style="display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500"><span aria-hidden="true" style="{{c.dot}}"></span>{{c.name}}</span><span style="font-size: 11px; color: #5A5E62; letter-spacing: 0.05em">{{c.hint}}</span></a></sc-for>
</div>
</div>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"locale":{"editor":"enum","default":"ja","options":["ja","en","zhs","zht","ko","th"]},"$preview":{"width":1440,"height":1500}}'>

f4.jpg", "assets/a4a275f1aed563a6b37d3597e324291b.jpg", "assets/87ee89003ab3ef49f26d2fc048fd6201.jpg", "assets/15dfb35e3e4e3d5d0c2ce79497c144e5.jpg"]};

class Component extends DCLogic {
  renderVals() {
    const loc = VA_SC.T[this.props.locale] ? this.props.locale : 'ja';

    const keys = L.order.concat(L.social);
    const chans = keys.map((k, i) => {
      const c = VA_SC.CH[k]; const href = K[k] || '#';
      const first = i === 0;
      return { name: c[0], hint: H[k], href, target: /^https?:/.test(href) ? '_blank' : '_self',

    });
    const F = VA_SC_FONT[loc];

  }
}
</script>
</body>
</html>
