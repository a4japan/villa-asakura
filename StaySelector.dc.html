<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>邸宅をえらぶ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Italiana&amp;family=Shippori+Mincho+B1:wght@400;600&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.va-stage{--R:min(37cqw,520px)}
.va-card{transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity .6s ease,translate .3s ease,box-shadow .3s ease}
.va-card:hover{translate:0 -14px;box-shadow:0 40px 80px rgba(0,0,0,.55) !important}
.va-card:focus-visible{outline:3px solid #E9C77B;outline-offset:4px}
.va-ring{animation:va-spin 36s linear infinite}
.va-ring:hover{animation-play-state:paused}
.va-pop{animation:va-pop .9s cubic-bezier(.2,.8,.2,1) both}
.va-pop:hover{filter:brightness(1.12)}
.va-fade{animation:va-fade .8s ease both}
@keyframes va-spin{from{transform:rotateX(-15deg) rotateY(0deg)}to{transform:rotateX(-15deg) rotateY(-360deg)}}
@keyframes va-pop{from{opacity:0;transform:translateZ(calc(var(--R) * -1)) scale(.2)}to{opacity:1;transform:none}}
@keyframes va-fade{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.va-ring{animation:none}.va-pop,.va-fade{animation:none}.va-card{transition:none}}
</style>
</helmet>
<div class="va-stage" style="position: relative; width: 100%; height: 920px; overflow: hidden; background: radial-gradient(ellipse at 50% 55%, #1B2630 0%, #0B0F13 72%); color: #F2F1EE; font-family: {{ fSans }}; line-height: 1.8">
<div style="position: absolute; left: 0; right: 0; top: 0; padding: 64px clamp(20px, 5cqw, 64px) 0; text-align: center; z-index: 5">
<p style="margin: 0 0 10px; font-size: 12px; letter-spacing: 0.34em; color: #A9C4CF">CHOOSE YOUR STAY</p>
<h2 style="margin: 0; font-family: {{ fSerif }}; font-weight: 400; font-size: clamp(24px, 2.8cqw, 38px); letter-spacing: 0.06em">{{ heading }}</h2>
</div>

<div style="position: absolute; left: 0; right: 0; top: 170px; bottom: 60px; perspective: 2400px; perspective-origin: 50% 30%">
<sc-if value="{{ showRing }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 50%; top: 44%; width: 0; height: 0; transform-style: preserve-3d">
<div class="va-ring" style="position: absolute; left: 0; top: 0; transform-style: preserve-3d">
<sc-for list="{{ ring }}" as="r" hint-placeholder-count="12"><div style="position: absolute; left: 0; top: 0; transform-style: preserve-3d; transform: rotateY({{ r.deg }}deg) translateZ(var(--R))"><a class="va-pop" href="{{ r.gal }}" aria-label="{{ r.label }}" style="position: absolute; left: clamp(-75px, -5cqw, -45px); top: clamp(-114px, -7.6cqw, -74px); display: block; width: clamp(90px, 10cqw, 150px); aspect-ratio: 3 / 4; padding: 6px 6px 22px; background: #F4F1EA; box-shadow: 0 18px 40px rgba(0,0,0,.45); animation-delay: {{ r.delay }}"><img src="{{ r.src }}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></a></div></sc-for>
</div>
</div>
</sc-if>

<sc-for list="{{ cards }}" as="c" hint-placeholder-count="3"><button class="va-card" onClick="{{ c.pick }}" aria-label="{{ c.aria }}" tabIndex="{{ c.tab }}" style="position: absolute; left: 50%; top: 46%; width: clamp(150px, 22cqw, 300px); margin: 0; padding: 10px 10px 0; border: 0; background: #F4F1EA; color: #111315; cursor: pointer; text-align: left; transform: translate(-50%, -50%) {{ c.tf }}; opacity: {{ c.op }}; pointer-events: {{ c.pe }}; z-index: {{ c.z }}; box-shadow: 0 30px 60px rgba(0,0,0,.45)"><img src="{{ c.cover }}" alt="" style="width: 100%; aspect-ratio: 3 / 4; object-fit: cover; display: block"><span style="display: block; padding: 12px 4px 14px"><span style="display: block; font-family: 'Italiana', serif; font-size: clamp(18px, 1.8cqw, 26px); letter-spacing: 0.08em; line-height: 1.2">{{ c.name }}</span><span style="display: block; font-size: 12px; color: #5A5E62; letter-spacing: 0.1em">{{ c.jp }}</span></span></button></sc-for>

<sc-if value="{{ showInfo }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); width: min(640px, 90cqw); padding: 48px 24px; box-sizing: border-box; text-align: center; z-index: 20; pointer-events: none; background: radial-gradient(closest-side, rgba(11,15,19,.82), rgba(11,15,19,.55) 60%, rgba(11,15,19,0))"><div class="va-fade" style="animation-delay: .35s">
<p style="margin: 0 0 6px; font-size: 12px; letter-spacing: 0.3em; color: #E9C77B">{{ cur.jp }}</p>
<p style="margin: 0; font-family: 'Italiana', serif; font-size: clamp(38px, 5cqw, 72px); letter-spacing: 0.06em; line-height: 1.05; white-space: nowrap; text-shadow: 0 6px 30px rgba(0,0,0,.6)">{{ cur.name }}</p>
<p style="margin: 14px 0 0; font-family: {{ fSerif }}; font-size: clamp(17px, 1.8cqw, 22px); text-shadow: 0 4px 20px rgba(0,0,0,.7)">{{ cur.line }}</p>
<p style="margin: 6px 0 22px; font-size: 13px; color: #C9CCCF; text-shadow: 0 4px 20px rgba(0,0,0,.7)">{{ cur.sub }}</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; pointer-events: auto">
<a href="{{ cur.href }}" style="display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 30px; background: #F2F1EE; color: #111315; font-size: 13px; letter-spacing: 0.2em">{{ cur.go }}<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 7 H12 M8 3 L12 7 L8 11" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></a>
<button onClick="{{ back }}" style="min-height: 52px; padding: 0 24px; border: 1px solid rgba(242,241,238,.6); background: rgba(11,15,19,.5); color: #F2F1EE; font-family: inherit; font-size: 13px; letter-spacing: 0.15em; cursor: pointer">{{ backLabel }}</button>
</div>
</div>
</div>
</sc-if>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 24px; display: flex; justify-content: center; gap: 8px; z-index: 30">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3"><button onClick="{{ t.pick }}" aria-pressed="{{ t.on }}" style="min-height: 44px; padding: 0 18px; border: 1px solid {{ t.bd }}; background: {{ t.bg }}; color: {{ t.fg }}; font-family: 'Italiana', serif; font-size: 15px; letter-spacing: 0.12em; cursor: pointer">{{ t.name }}</button></sc-for>
</div>
<p style="position: absolute; left: 0; right: 0; bottom: 74px; margin: 0; text-align: center; font-size: 12px; letter-spacing: 0.15em; color: #8A9196; z-index: 30">{{ hint }}</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"locale":{"editor":"enum","default":"ja","options":["ja","en","zhs","zht","ko","th"]},"$preview":{"width":1440,"height":920}}'>
const VA_SS_I18N = {"ja": {"stays": null, "hp": "3つの邸宅から、ひとつをえらぶ。", "hs": "アルバムをめくるように、のぞいてみる。", "tp": "写真をタップすると、その邸宅のアルバムが開きます", "ts": "写真にふれると止まります ・ 写真をタップするとギャラリーへ", "go": "{n} へ入る", "back": "ほかの邸宅をえらぶ", "aria": "{n}（{j}）をえらぶ", "ring": "{n}の写真をギャラリーで見る"}, "en": {"stays": {"resort": ["Villa by the sea", "A private museum afloat on the sea.", "A private villa on the 4th and 5th floors, with 270° views of the Seto Inland Sea."], "cp": ["Villa in the city", "Park greenery and skylight.", "A 4F–5F maisonette in the heart of Takamatsu."], "atelier": ["Gallery room", "Sleep surrounded by art.", "On the 1st floor of the same building. A wall of art and a freestanding bathtub."]}, "hp": "Choose one of three villas.", "hs": "Leaf through the album.", "tp": "Tap a photo to open that villa’s album", "ts": "Hover to pause ・ Tap a photo to open the gallery", "go": "Enter {n}", "back": "Choose another villa", "aria": "Choose {n}", "ring": "See {n} photos in the gallery"}, "zhs": {"stays": {"resort": ["海边宅邸", "浮于海上的私人美术馆。", "270度俯瞰濑户内的4・5楼整栋宅邸。"], "cp": ["城市宅邸", "公园的绿意与天窗的光。", "高松市中心的4・5楼复式。"], "atelier": ["画廊之屋", "在作品环绕中入眠。", "同一栋楼的1楼。整面墙的艺术与独立浴缸。"]}, "hp": "从三座宅邸中，选择一座。", "hs": "像翻阅相册一样，看一看。", "tp": "点击照片，打开该宅邸的相册", "ts": "触碰照片即暂停 ・ 点击照片进入图库", "go": "进入 {n}", "back": "选择其他宅邸", "aria": "选择 {n}", "ring": "在图库中查看 {n} 的照片"}, "zht": {"stays": {"resort": ["海邊宅邸", "浮於海上的私人美術館。", "270度俯瞰瀨戶內的4・5樓包棟宅邸。"], "cp": ["城市宅邸", "公園的綠意與天窗的光。", "高松市中心的4・5樓樓中樓。"], "atelier": ["畫廊之屋", "在作品環繞中入眠。", "同一棟樓的1樓。整面牆的藝術與獨立浴缸。"]}, "hp": "從三座宅邸中，選擇一座。", "hs": "像翻閱相簿一樣，看一看。", "tp": "點擊照片，打開該宅邸的相簿", "ts": "觸碰照片即暫停 ・ 點擊照片進入圖庫", "go": "進入 {n}", "back": "選擇其他宅邸", "aria": "選擇 {n}", "ring": "在圖庫中查看 {n} 的照片"}, "ko": {"stays": {"resort": ["바닷가 저택", "바다 위에 떠 있는 개인 미술관.", "세토내해를 270도로 내려다보는 4・5층 독채 저택."], "cp": ["도심의 저택", "공원의 초록과 천창의 빛.", "다카마쓰 한가운데의 4・5층 복층."], "atelier": ["갤러리 룸", "작품에 둘러싸여 잠들다.", "같은 건물 1층. 벽 한 면의 아트와 독립형 욕조."]}, "hp": "세 개의 저택 중에서 하나를 고르세요.", "hs": "앨범을 넘기듯이 들여다보세요.", "tp": "사진을 누르면 그 저택의 앨범이 열립니다", "ts": "사진에 손을 대면 멈춥니다 ・ 사진을 누르면 갤러리로", "go": "{n} 들어가기", "back": "다른 저택 고르기", "aria": "{n} 선택", "ring": "{n} 사진을 갤러리에서 보기"}, "th": {"stays": {"resort": ["คฤหาสน์ริมทะเล", "พิพิธภัณฑ์ส่วนตัวที่ลอยอยู่กลางทะเล", "คฤหาสน์เหมาชั้น 4–5 มองเห็นทะเลเซโตะใน 270 องศา"], "cp": ["คฤหาสน์ในเมือง", "สีเขียวของสวนและแสงจากช่องหลังคา", "เมซอเนตชั้น 4–5 ใจกลางทาคามัตสึ"], "atelier": ["ห้องแกลเลอรี", "หลับท่ามกลางงานศิลปะ", "ชั้น 1 ของอาคารเดียวกัน ผนังศิลปะเต็มผนังและอ่างอาบน้ำแบบตั้งอิสระ"]}, "hp": "เลือกหนึ่งในสามคฤหาสน์", "hs": "เปิดดูราวกับพลิกอัลบั้ม", "tp": "แตะรูปเพื่อเปิดอัลบั้มของคฤหาสน์นั้น", "ts": "แตะค้างเพื่อหยุด ・ แตะรูปเพื่อไปที่แกลเลอรี", "go": "เข้าสู่ {n}", "back": "เลือกคฤหาสน์อื่น", "aria": "เลือก {n}", "ring": "ดูรูป {n} ในแกลเลอรี"}};
const VA_SS_FONT = {"ja": ["'Shippori Mincho B1', serif", "'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif"], "en": ["'Shippori Mincho B1', serif", "'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif"], "zhs": ["'Noto Serif SC', 'Shippori Mincho B1', serif", "'Noto Sans SC', 'Zen Kaku Gothic New', sans-serif"], "zht": ["'Noto Serif TC', 'Shippori Mincho B1', serif", "'Noto Sans TC', 'Zen Kaku Gothic New', sans-serif"], "ko": ["'Noto Serif KR', 'Shippori Mincho B1', serif", "'Noto Sans KR', 'Zen Kaku Gothic New', sans-serif"], "th": ["'Noto Serif Thai', 'Shippori Mincho B1', serif", "'Noto Sans Thai', 'Zen Kaku Gothic New', sans-serif"]};
const VA_STAYS = {"resort": {"name": "RESORT", "jp": "海辺の邸宅", "line": "海に浮かぶ、私設美術館。", "sub": "瀬戸内を270度見わたす、4・5階の貸切邸宅。", "href": "Resort.dc.html", "gal": "ResortGallery.dc.html", "cover": "assets/7fb50395e96c94d1ab5fe7981eb08977.jpg", "ring": ["assets/5c4882ab43a3b96e22f1e5cf39cbf10f.jpg", "assets/3a21de009c570eae6d2d88027fa2eb11.jpg", "assets/80cca8c8c3ef4f59a158337a95818e18.jpg", "assets/c3c084e5272772913cf4d7be286e8a5a.jpg", "assets/8fe86b57f2b6dc2fe047fbdae7195a76.jpg", "assets/ef1ef7f6bbba6cba61a6ec17d219777e.jpg", "assets/d41f05efcae07444dfc8af862820c29d.jpg", "assets/2737bd6e9155f5a1460bf75aa9cd4e0e.jpg", "assets/c620d453dc0545958d768c8fd2e20e72.jpg", "assets/9389f76205125dab5591491b0539f3b2.jpg", "assets/e9bc8629af0b8b73af16252d4da02051.jpg", "assets/b8092ab1e65c529dcef2b76cd2bbfda5.jpg"]}, "cp": {"name": "CENTRAL PARK", "jp": "街の邸宅", "line": "公園の緑と、天窓の光。", "sub": "高松の真ん中、4・5階のメゾネット。", "href": "CentralPark.dc.html", "gal": "CentralParkGallery.dc.html", "cover": "assets/f6d0df528cbf7a69b3f9e1fc05739b83.jpg", "ring": ["assets/1669fa279e55566750d4e9fb105caa17.jpg", "assets/cc56fe0f80ce78de022454c02b550c75.jpg", "assets/c9e07dcd82e5fa2009fc5ceb8847acea.jpg", "assets/593fee23a1606222abc152f5c31889dd.jpg", "assets/e7833269115811711e6cb35beae6b776.jpg", "assets/d83fbbcb88e77e32074fc56f3e6cf27f.jpg", "assets/86f19c5af2bb0d8370154e61ac02783b.jpg", "assets/72d43fab9420389965a537f754b85956.jpg", "assets/bfabd92669a7f9f935809c0d5b6a12db.jpg", "assets/a659193c03e7a104d38d29543505cc87.jpg", "assets/0249ba5f9792fc2d4aff403215a30789.jpg", "assets/2dac205c79892b1d1eb65d4eb71a655f.jpg"]}, "atelier": {"name": "ATELIER", "jp": "ギャラリーの部屋", "line": "作品に囲まれて、眠る。", "sub": "同じ建物の1階。壁一面のアートと、独立型のバスタブ。", "href": "Atelier.dc.html", "gal": "AtelierGallery.dc.html", "cover": "assets/c9610634d72290b5b558d21a86c96547.jpg", "ring": ["assets/f51e268d0f1a7bc6f0d01a6bed20bf13.jpg", "assets/d1bc17606218ec961b5af4ac8df9b39f.jpg", "assets/0a4486be398495bf7d4d7a1591ff7fb3.jpg", "assets/4af8879122a7f3fe63dd09e51171a259.jpg", "assets/9b91b39a8b3edbb3d207b190b6ce3873.jpg", "assets/c82179abf7bbdaabb52079a03bf25f06.jpg", "assets/ab7bfea5de2c96e2869237435c67c645.jpg", "assets/2438d8b1af347538ba19f3512de02128.jpg", "assets/7427654ca002bfc14f615ff6923b6b84.jpg", "assets/8fa8488153a3e05cc1c4c464838bf9b2.jpg", "assets/91c1c9ae3b96241b32a39aade5a5d7ef.jpg", "assets/a919f61143d5416f5f5c15a71a7d4cf1.jpg"]}};
class Component extends DCLogic {
  componentWillUnmount() { clearTimeout(this._t); }
  select(k) {
    clearTimeout(this._t);
    this.setState({ sel: k, phase: 'fly' });
    this._t = setTimeout(() => this.setState({ phase: 'ring' }), 650);
  }
  renderVals() {
    const st = this.state || {};
    const loc = VA_SS_I18N[this.props.locale] ? this.props.locale : 'ja';
    const L = VA_SS_I18N[loc];
    const tx = (k, d) => (L.stays && L.stays[k]) ? { jp: L.stays[k][0], line: L.stays[k][1], sub: L.stays[k][2] } : { jp: d.jp, line: d.line, sub: d.sub };
    const fmt = (t, n, j) => t.replace('{n}', n).replace('{j}', j || '');
    const keys = Object.keys(VA_STAYS);
    const sel = VA_STAYS[st.sel] ? st.sel : null;
    const phase = sel ? (st.phase || 'fly') : 'pick';
    const POS = { resort: 'translateX(-112%) rotate(-7deg)', cp: 'translateY(-14px) rotate(1deg)', atelier: 'translateX(112%) rotate(6deg)' };
    const cards = keys.map((k) => {
      const d = VA_STAYS[k];
      let tf = POS[k], op = 1, pe = 'auto', z = k === 'cp' ? 3 : 2;
      if (sel) {
        if (k === sel) { tf = phase === 'ring' ? 'scale(0.35) rotate(0deg)' : 'scale(0.82) rotate(0deg)'; op = phase === 'ring' ? 0 : 1; z = 10; }
        else { tf = POS[k] + ' translateY(140%)'; op = 0; }
        pe = 'none';
      }
      return { name: d.name, cover: d.cover, tf, op, pe, z, tab: sel ? '-1' : '0', aria: fmt(L.aria, d.name, tx(k, d).jp), jp: tx(k, d).jp, pick: () => this.select(k) };
    });
    const cur = sel ? VA_STAYS[sel] : null;
    const n = cur ? cur.ring.length : 0;
    const ring = cur ? cur.ring.map((src, i) => ({ src, deg: (360 / n * i).toFixed(2), delay: (i * 0.06).toFixed(2) + 's', gal: cur.gal, label: fmt(L.ring, cur.name) })) : [];
    const tabs = keys.map((k) => {
      const on = k === sel;
      return { name: VA_STAYS[k].name, on: on ? 'true' : 'false', bg: on ? '#F2F1EE' : 'transparent', fg: on ? '#111315' : '#F2F1EE', bd: on ? '#F2F1EE' : 'rgba(242,241,238,.35)', pick: () => { if (!on) this.select(k); } };
    });
    return {
      cards, ring, tabs,
      showRing: phase === 'ring', showInfo: phase === 'ring',
      heading: sel ? L.hs : L.hp, backLabel: L.back, fSerif: VA_SS_FONT[loc][0], fSans: VA_SS_FONT[loc][1],
      hint: sel ? L.ts : L.tp,
      cur: cur ? { name: cur.name, jp: tx(sel, cur).jp, line: tx(sel, cur).line, sub: tx(sel, cur).sub, href: cur.href, go: fmt(L.go, cur.name) } : { name: '', jp: '', line: '', sub: '', href: '#', go: '' },
      back: () => { clearTimeout(this._t); this.setState({ sel: null, phase: 'pick' }); }
    };
  }
}
</script>
