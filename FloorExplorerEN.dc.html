<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floor explorer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Italiana&amp;family=Shippori+Mincho+B1:wght@400;600&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.va-spot{transition:background-color .15s ease}
.va-spot:hover{background-color:rgba(35,72,90,0.16) !important}
.va-spot:focus-visible{outline:3px solid #23485A;outline-offset:-3px}
.va-chip:hover{border-color:#111315 !important}
</style>
</helmet>
<div style="width: 100%; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif; color: #111315; line-height: 1.8">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; margin-bottom: 20px">
<div role="tablist" aria-label="Floor" style="display: flex; gap: 8px">
<sc-for list="{{ floors }}" as="f" hint-placeholder-count="2"><button role="tab" aria-selected="{{ f.on }}" onClick="{{ f.pick }}" style="min-width: 88px; min-height: 48px; padding: 0 22px; border: 1px solid #111315; background: {{ f.bg }}; color: {{ f.fg }}; font-family: 'Italiana', serif; font-size: 22px; letter-spacing: 0.08em; cursor: pointer">{{ f.label }}</button></sc-for>
</div>
<p style="margin: 0; display: flex; align-items: center; gap: 10px; font-size: 14px; color: #3E4246"><span style="display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: #23485A; box-shadow: 0 0 0 4px rgba(35,72,90,0.18)"></span>Hover over or tap a marked room.</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 32px 40px; align-items: flex-start">
<div style="flex: 1.2 1 520px; min-width: 0">
<div style="position: relative; width: 100%; aspect-ratio: {{ ar }}; border: 1px solid #C9C8C3; background: #F7F5F0">
<img src="{{ plan }}" alt="{{ planAlt }}" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block">
<sc-for list="{{ spots }}" as="s" hint-placeholder-count="12"><button class="va-spot" aria-label="{{ s.jp }}" aria-pressed="{{ s.on }}" onClick="{{ s.pick }}" onMouseEnter="{{ s.pick }}" onFocus="{{ s.pick }}" style="position: absolute; left: {{ s.l }}; top: {{ s.t }}; width: {{ s.w }}; height: {{ s.h }}; margin: 0; padding: 0; border: 0; cursor: pointer; background-color: {{ s.bg }}; box-shadow: {{ s.ring }}"><span style="position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: {{ s.dot }}; box-shadow: 0 0 0 4px rgba(255,255,255,0.85)"></span></button></sc-for>
</div>
</div>
<div style="flex: 1 1 340px; min-width: 0">
<div style="position: relative; width: 100%; aspect-ratio: 4 / 3; background: #E6E5E0; overflow: hidden">
<sc-if value="{{ cur.isImg }}" hint-placeholder-val="{{ true }}"><img src="{{ cur.src }}" alt="{{ cur.jp }}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block"></sc-if>
<sc-if value="{{ cur.isVideo }}" hint-placeholder-val="{{ false }}"><video src="{{ cur.src }}" autoPlay="true" muted="true" loop="true" playsInline="true" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; background: #111315"></video></sc-if>
<sc-if value="{{ cur.none }}" hint-placeholder-val="{{ false }}"><div style="position: absolute; inset: 0; border: 1px dashed #8A8E92; display: flex; align-items: center; justify-content: center; font-size: 13px; letter-spacing: 0.15em; color: #5A5E62">Photographs in preparation</div></sc-if>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px">
<sc-for list="{{ cur.thumbs }}" as="t" hint-placeholder-count="3"><button aria-label="{{ t.label }}" onClick="{{ t.pick }}" onMouseEnter="{{ t.pick }}" style="position: relative; width: 72px; height: 54px; padding: 0; border: 0; cursor: pointer; background: #111315; box-shadow: {{ t.ring }}; overflow: hidden"><sc-if value="{{ t.isImg }}" hint-placeholder-val="{{ true }}"><img src="{{ t.src }}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></sc-if><sc-if value="{{ t.isVideo }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 4px; color: #F2F1EE; font-size: 10px; letter-spacing: 0.15em"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 2 L10 6 L3 10 Z" fill="#F2F1EE"/></svg>MOVIE</span></sc-if></button></sc-for>
</div>
<p style="margin: 24px 0 0; font-size: 11px; letter-spacing: 0.24em; color: #5A5E62">{{ cur.floor }} ・ {{ cur.en }}</p>
<h3 style="margin: 4px 0 10px; font-family: 'Shippori Mincho B1', serif; font-weight: 400; font-size: 28px; line-height: 1.5">{{ cur.jp }}</h3>
<p style="margin: 0 0 8px; font-size: 15px; color: #3E4246">{{ cur.desc }}</p>
<p style="margin: 0; font-size: 13px; color: #5A5E62">{{ cur.count }}</p>
<p style="margin: 28px 0 12px; font-size: 11px; letter-spacing: 0.24em; color: #5A5E62">Rooms on {{ floorName }}</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{ spots }}" as="c" hint-placeholder-count="8"><button class="va-chip" onClick="{{ c.pick }}" style="min-height: 40px; padding: 0 14px; border: 1px solid {{ c.chipBorder }}; background: {{ c.chipBg }}; color: {{ c.chipFg }}; font-size: 13px; cursor: pointer">{{ c.jp }}</button></sc-for>
</div>
</div>
</div>
</div>
</x-dc>

class Component extends DCLogic {
  renderVals() {
    const ACC = '#23485A';
    const st = this.state || {};
    const site = VA_DATA[this.props.site] ? this.props.site : 'resort';
    const SD = VA_DATA[site];
    const keys = Object.keys(SD.floors);
    const floor = (st.floor && SD.floors[st.floor]) ? st.floor : (SD.floors[this.props.startFloor] ? this.props.startFloor : keys[0]);
    const fd = SD.floors[floor];
    const pct = (v, total) => (v / total * 100).toFixed(3) + '%';
    const floors = keys.map((k) => ({
      label: k, on: k === floor ? 'true' : 'false',
      bg: k === floor ? '#111315' : 'transparent', fg: k === floor ? '#F2F1EE' : '#111315',
      pick: () => this.setState({ floor: k, room: SD.floors[k].rooms[0].id, idx: 0 })
    }));
    const room = fd.rooms.find((r) => r.id === st.room) || fd.rooms[0];
    const spots = fd.rooms.map((r) => {
      const on = r.id === room.id;
      const has = r.media.length > 0;
      return {
        jp: r.jp, on: on ? 'true' : 'false',
        l: pct(r.x, fd.vw), t: pct(r.y, fd.vh), w: pct(r.w, fd.vw), h: pct(r.h, fd.vh),
        bg: on ? 'rgba(35,72,90,0.22)' : 'rgba(35,72,90,0.03)',
        ring: on ? 'inset 0 0 0 3px ' + ACC : 'none',
        dot: has ? ACC : '#A3A7AB',
        chipBg: on ? '#111315' : 'transparent', chipFg: on ? '#F2F1EE' : '#111315',
        chipBorder: on ? '#111315' : '#C9C8C3',
        pick: () => { if (room.id !== r.id) this.setState({ floor, room: r.id, idx: 0 }); }
      };
    });
    const idx = Math.min(st.idx || 0, Math.max(room.media.length - 1, 0));
    const m = room.media[idx];
    const thumbs = room.media.length > 1 ? room.media.map((x, i) => ({
      src: x.src, isImg: !x.v, isVideo: !!x.v, label: x.v ? 'Watch the film' : 'Photos ' + (i + 1),
      ring: i === idx ? 'inset 0 0 0 3px ' + ACC + ', 0 0 0 1px ' + ACC : 'none',
      pick: () => { if (idx !== i) this.setState({ floor, room: room.id, idx: i }); }
    })) : [];
    const nPhoto = room.media.filter((x) => !x.v).length;
    const nVideo = room.media.filter((x) => x.v).length;
    const count = room.media.length === 0 ? 'Photographs will be added as they are taken.' : ('Photos ' + nPhoto + '' + (nVideo ? ' ・ ' + nVideo + ' films' : ''));
    return {
      floors, spots, plan: fd.plan, planAlt: SD.name + ' ' + floor + ' floor plan', floorName: floor, ar: fd.vw + ' / ' + fd.vh,
      cur: {
        floor, en: room.en, jp: room.jp, desc: room.desc, count, thumbs,
        isImg: !!m && !m.v, isVideo: !!m && !!m.v, none: !m, src: m ? m.src : ''
      }
    };
  }
}
